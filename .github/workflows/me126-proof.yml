name: ME-126 proof
on:
  push:
    branches: ['servi/me-126-ci-proof*']
permissions:
  contents: read
jobs:
  two-prompts-30:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: two-prompts 30 runs in a row
        run: |
          for i in $(seq 30); do
            node scripts/e2e.mjs --scenario=two-prompts > run.log 2>&1 || { cat run.log; echo "RESULT two-prompts: failed on run $i"; exit 1; }
            grep -E "^ok" run.log
          done
          echo "RESULT two-prompts: 30 of 30 in a row passed"
  two-prompts-trace:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: two-prompts with a trace, 15 runs
        run: |
          pass=0; fail=0
          for i in $(seq 15); do
            if node scripts/e2e.mjs --file=zz-trace > run.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "--- run $i failed"; grep -E "TRACE|FAIL" run.log; fi
          done
          echo "RESULT two-prompts-trace: $pass passed, $fail failed"
  slow-frames:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: slow-frames, 10 runs
        run: |
          pass=0; fail=0
          for i in $(seq 10); do
            if node scripts/e2e.mjs --file=slow-frames > run.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "--- run $i failed"; grep -E "FAIL" run.log; fi
          done
          echo "RESULT slow-frames: $pass passed, $fail failed"
  freeze:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: freeze probe, 10 runs
        run: |
          for i in $(seq 10); do
            node scripts/e2e.mjs --file=zz-freeze > run.log 2>&1; grep -E "FREEZE|FAIL" run.log
          done
