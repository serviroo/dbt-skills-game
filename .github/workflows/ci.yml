name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gitleaks
        uses: ./.github/actions/pinned-download
        with:
          url: https://127.0.0.1:9/gitleaks.tar.gz
          sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - name: Install gitleaks
        run: tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
        env:
          ARCHIVE: ${{ steps.gitleaks.outputs.file }}
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'
