name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Busy page at x80 and drop counts, base then this head
        shell: bash
        run: |
          set +e
          git worktree add ../base bf7df9b7f60c919264a1128fa63e58059e1b1cb2
          ln -s "$PWD/node_modules" ../base/node_modules
          count() {
            j=$(ls -td "$1"/artifacts/e2e/*/ | head -1)cues-on-time.jsonl
            node -e '
              const rows = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse)
                .filter((r) => r.name === "cues");
              const by = {};
              for (const r of rows) { by[r.rate] ??= { n: 0, d: [] }; by[r.rate].n++; if (r.dropped) by[r.rate].d.push(r.part); }
              console.log(Object.entries(by).map(([k, v]) => `x${k}: ${v.d.length}/${v.n} ${v.d.join(" ")}`).join(" | "));' "$j"
          }
          for pass in 1 2; do
            for d in ../base .; do
              (cd "$d" && sed -i 's/^const RATES = \[4, 10, 20\];/const RATES = [4, 10, 20, 80];/' scripts/e2e/cues-on-time.e2e.mjs \
                && node scripts/e2e.mjs --software --file=cues-on-time --scenario=every-score-part-opens-on-time-on-a-busy-page > busy.log 2>&1; \
                echo "pass $pass $d busy80 exit $? $(grep -oE 'FAIL.{0,700}' busy.log | head -1)"; git checkout -q scripts/e2e/cues-on-time.e2e.mjs)
              (cd "$d" && node scripts/e2e.mjs --software --file=cues-on-time --scenario=every-cue-starts-on-time-however-slow-its-build > drops.log 2>&1; \
                echo "pass $pass $d drops exit $?")
              count "$d"
            done
          done
