name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [round7, doors]
        part: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Product code for this side
        shell: bash
        run: |
          case "${{ matrix.side }}" in
            round7) git checkout dfe4881853c45ba3f2a5f6a876351e821eac3198 -- src ;;
            doors) git checkout dfe4881853c45ba3f2a5f6a876351e821eac3198 -- src && sed -i 's/      gate.offset.setValueAtTime(1, openedAt);/      for (const v of voices) for (const d of v.doors) d.g.gain.setValueAtTime(1, openedAt);/' src/audio/voice.ts && grep -n "d.g.gain.setValueAtTime(1, openedAt)" src/audio/voice.ts ;;
            main) git checkout aed9ced -- src && sed -i 's/gains: () => e.levels };/gains: () => e.levels, engine: e };/' src/app.ts ;;
          esac
          git log -1 --format=%h; git status --short src | head -5; grep -n "__dbtVolume =" -A1 src/app.ts | head -2
      - name: Repeat the two Safe Zone sound checks
        shell: bash
        run: |
          set +e
          mkdir -p results
          out=results/${{ matrix.side }}-${{ matrix.part }}.txt
          for i in $(seq 1 8); do
            node scripts/e2e.mjs --software --file=safe-zone-quiet --scenario=quiet-entry-at-every-size > run.log 2>&1
            echo "visit $i $([ $? -eq 0 ] && echo pass || echo fail)" >> "$out"
            grep -E "^FAIL" run.log | cut -c1-6000 >> "$out"
          done
          cat "$out" | cut -c1-300
          exit 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.side }}-${{ matrix.part }}
          path: results
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repeat-${{ matrix.side }}-${{ matrix.part }}
          path: artifacts/e2e
          retention-days: 3
          if-no-files-found: ignore
