name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    env:
      STORED_IDS_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Browsers come from the container
        run: test "$(npx playwright --version)" = "Version 1.64.1" || { echo "package-lock has $(npx playwright --version); set the same version in the container image above"; exit 1; }
      - run: npx tsc --noEmit -p .
      - name: Stored ids
        run: npm run check:ids
      - run: npm run build
      - name: PWA offline launch
        run: node scripts/pwa-verify.mjs --check
      - name: PWA update
        run: node scripts/pwa-verify.mjs --update --check
      - name: CSP sweep
        run: node scripts/pwa-csp-sweep.mjs --check
      - name: E2E runner contract
        run: node scripts/e2e-runner-check.mjs
      - name: PWA failure paths and Firefox storage
        run: node scripts/e2e/me-93-pwa-resilience.e2e.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-${{ github.run_attempt }}
          path: |
            artifacts/e2e
            qa/out/pwa
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    env:
      STORED_IDS_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Browsers come from the container
        run: test "$(npx playwright --version)" = "Version 1.64.1" || { echo "package-lock has $(npx playwright --version); set the same version in the container image above"; exit 1; }
      - name: E2E part ${{ matrix.shard }} of 6
        run: node scripts/e2e.mjs --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: artifacts/e2e
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'
