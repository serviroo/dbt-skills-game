name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 53
    env:
      STORED_IDS_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
      LINT_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tested tree
        timeout-minutes: 1
        run: echo "::notice title=tested-tree::$(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - name: Browsers come from the container
        timeout-minutes: 1
        run: test "$(npx playwright --version)" = "Version 1.64.1" || { echo "package-lock has $(npx playwright --version); set the same version in the container image above"; exit 1; }
      - run: npx tsc --noEmit -p .
        timeout-minutes: 3
      - run: npm run lint
        timeout-minutes: 3
      - name: E2E undefined names
        timeout-minutes: 1
        run: node scripts/e2e-scope-check.mjs
      - name: Stored ids
        timeout-minutes: 1
        run: npm run check:ids
      - run: npm run build
        timeout-minutes: 5
        env:
          LANTERN_GL: software
      - name: The build changes no committed file
        timeout-minutes: 1
        run: test -z "$(git status --porcelain)" || { git status --short; echo "npm run build changed the files above; if it redrew the PWA images, commit them with scripts/icons.stamp"; exit 1; }
      - name: PWA offline launch
        timeout-minutes: 3
        run: node scripts/pwa-verify.mjs --software --check
      - name: PWA update
        timeout-minutes: 3
        run: node scripts/pwa-verify.mjs --software --update --check
      - name: CSP sweep
        timeout-minutes: 6
        run: node scripts/pwa-csp-sweep.mjs --software --check
      - name: E2E runner contract
        timeout-minutes: 5
        run: node scripts/e2e-runner-check.mjs --software
      - name: PWA failure paths and Firefox storage
        timeout-minutes: 3
        run: node scripts/e2e/me-93-pwa-resilience.e2e.mjs --software
      - uses: actions/upload-artifact@v7
        if: failure()
        timeout-minutes: 3
        with:
          name: checks-${{ github.run_attempt }}
          path: |
            artifacts/e2e
            qa/out/pwa
          retention-days: 3
          if-no-files-found: ignore

  # A push to main after a squash merge of an up-to-date PR has exactly the tree that PR's last run already proved, so
  # the push reuses that run's e2e parts instead of running them again. Any doubt or lookup error runs them in full.
  proven:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          repo=$GITHUB_REPOSITORY
          workflow=${GITHUB_WORKFLOW_REF%@*}
          workflow=${workflow##*/}
          [[ $BEFORE =~ ^[0-9a-f]{40}$ && $BEFORE != 0000000000000000000000000000000000000000 && $TREE =~ ^[0-9a-f]{40}$ ]] || { echo "::notice::No earlier main commit to compare with: running the e2e parts in full"; exit 0; }
          # an up-to-date PR contains main's previous commit, so its run is newer than that commit
          since=$(gh api "repos/$repo/commits/$BEFORE" --jq .commit.committer.date)
          gh api --paginate "repos/$repo/actions/workflows/$workflow/runs?status=success&exclude_pull_requests=true&per_page=100&created=>=$since" |
            jq -r --arg repo "$repo" --arg tree "$TREE" '.workflow_runs[] | select(.head_repository.full_name == $repo and .head_commit.tree_id == $tree) | "\(.id) \(.head_sha)"' > "$RUNNER_TEMP/candidates"
          while read -r id sha; do
            jobs=$(gh api "repos/$repo/actions/runs/$id/jobs?per_page=100")
            jq -e --arg me "$GITHUB_JOB" '[.jobs[] | select(.name != $me)] | length > 0 and all(.conclusion == "success")' <<< "$jobs" > /dev/null || continue
            # a PR run tests its head merged into its base, not the head itself, so trust only the tree its check job saw
            check=$(jq -r '.jobs[] | select(.name == "check") | .id' <<< "$jobs")
            tested=$(gh api "repos/$repo/check-runs/$check/annotations" --jq '.[] | select(.title == "tested-tree") | .message')
            [[ $tested == "$TREE" ]] || continue
            url="$GITHUB_SERVER_URL/$repo/actions/runs/$id"
            echo "::notice title=E2E reused::Run $id tested this tree with every job passing: $url"
            echo "E2E reused from [run $id]($url), which passed every job and tested this commit's tree \`$TREE\` (head \`$sha\`)." >> "$GITHUB_STEP_SUMMARY"
            echo "run=$id" >> "$GITHUB_OUTPUT"
            exit 0
          done < "$RUNNER_TEMP/candidates"
          echo "::notice::No passing run tested this tree: running the e2e parts in full"

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
      shards: ${{ steps.parts.outputs.shards }}
    steps:
      - id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-timings&per_page=50" | node -e '
            let json = "";
            process.stdin.on("data", (chunk) => json += chunk);
            process.stdin.on("end", () => {
              const { artifacts } = JSON.parse(json);
              const candidates = artifacts.filter((a) => a?.name === "e2e-timings" && !a.expired &&
                typeof a.created_at === "string" &&
                a.workflow_run?.head_repository_id === Number(process.env.GITHUB_REPOSITORY_ID));
              candidates.sort((a, b) => b.created_at.localeCompare(a.created_at));
              for (const a of candidates) console.log(a.workflow_run.id);
            });')
          while read -r run; do
            [[ $run =~ ^[0-9]+$ ]] || continue
            dir=$(mktemp -d "$RUNNER_TEMP/e2e-timings.XXXXXX")
            error="$dir/download.log"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" -n e2e-timings -D "$dir" 2>"$error"; then
              test -f "$dir/e2e-timings.json"
              mkdir -p "$RUNNER_TEMP/timings"
              mv "$dir/e2e-timings.json" "$RUNNER_TEMP/timings/e2e-timings.json"
              echo "::notice title=E2E timings::Parts split by the e2e-timings of run $run"
              exit 0
            fi
            cat "$error" >&2
            missing='no artifact matches|no valid artifacts found to download|HTTP (404|410)'
            grep -Eq "$missing" "$error" || exit 1
          done <<< "$runs"
          echo "::notice::No e2e-timings available: parts split by scripts/e2e/timings.json"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - id: parts
        name: Enough e2e parts that each finishes in time on the slowest runner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/plan-timings"
          timings="$RUNNER_TEMP/timings/e2e-timings.json"
          [ -f "$timings" ] || timings=scripts/e2e/timings.json
          cp "$timings" "$RUNNER_TEMP/plan-timings/e2e-timings.json"
          log=$RUNNER_TEMP/parts.log
          n=$(node scripts/e2e.mjs --parts "--timings=$RUNNER_TEMP/plan-timings/e2e-timings.json" 2>"$log") || {
            cat "$log"
            exit 1
          }
          [[ $n =~ ^[1-9][0-9]*$ ]] || { cat "$log"; echo "--parts printed '$n', not a part count"; exit 1; }
          echo "::notice title=E2E parts::$(cat "$log")"
          echo "parts=$n" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 1 "$n")]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-plan-timings
          path: ${{ runner.temp }}/plan-timings/e2e-timings.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  e2e:
    needs: [proven, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.proven.outputs.run == '' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 54
    env:
      STORED_IDS_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
    strategy:
      fail-fast: false
      # GitHub runs at most 20 jobs at once here, so parts past the first 20 jobs start as the first ones finish
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - name: Browsers come from the container
        timeout-minutes: 1
        run: test "$(npx playwright --version)" = "Version 1.64.1" || { echo "package-lock has $(npx playwright --version); set the same version in the container image above"; exit 1; }
      - uses: actions/download-artifact@v8
        timeout-minutes: 1
        with:
          name: e2e-plan-timings
          path: ${{ runner.temp }}/timings
      - name: E2E part ${{ matrix.shard }} of ${{ needs.plan.outputs.parts }}
        timeout-minutes: 30
        run: |
          shard=${{ matrix.shard }}/${{ needs.plan.outputs.parts }}
          timings=$RUNNER_TEMP/timings/e2e-timings.json
          timeout --foreground -s INT -k 1m 28m node scripts/e2e.mjs --software --shard="$shard" "--timings=$timings" &
          echo "$!" > "$RUNNER_TEMP/e2e.pid"
          code=0
          wait "$!" || code=$?
          if [ "$code" = 124 ] || [ "$code" = 137 ]; then
            echo "::error title=E2E part $shard::still running after 28 minutes, so it was stopped like Ctrl+C would"
          fi
          exit "$code"
      - name: Keep what a scenario cut off midway wrote
        id: keep
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          pid=$(cat "$RUNNER_TEMP/e2e.pid" 2>/dev/null || true)
          if [ "${{ job.status }}" = cancelled ] && [ -n "$pid" ] && kill -INT "$pid" 2>/dev/null; then
            for _ in $(seq 60); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
          fi
          node scripts/e2e/keep.mjs ${{ job.status == 'cancelled' && '--failed-only' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        timeout-minutes: 3
        with:
          name: failed-e2e-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ steps.keep.outcome == 'failure' && 'artifacts/e2e' || 'artifacts/e2e/*/failed' }}
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 2
        with:
          name: e2e-times-${{ matrix.shard }}
          path: artifacts/e2e/*/report.json
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true

  timings:
    needs: [plan, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-times-*
          path: ${{ runner.temp }}/times
      - uses: actions/download-artifact@v8
        with:
          name: e2e-plan-timings
          path: ${{ runner.temp }}/planned
      - name: Add this run's times
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/planned/e2e-timings.json" "$RUNNER_TEMP/out/e2e-timings.json"
          find "$RUNNER_TEMP/times" -name report.json -print0 | xargs -0 -r node scripts/e2e-timings.mjs --file="$RUNNER_TEMP/out/e2e-timings.json"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-timings
          path: ${{ runner.temp }}/out/e2e-timings.json
          retention-days: 30
          overwrite: true

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'
