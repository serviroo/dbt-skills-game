name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - name: PWA offline launch
        run: node scripts/pwa-verify.mjs --check
      - name: PWA update
        run: node scripts/pwa-verify.mjs --update --check
      - name: CSP sweep
        run: node scripts/pwa-csp-sweep.mjs --check
      - name: E2E
        run: node scripts/e2e.mjs
      - name: E2E runner contract
        run: node scripts/e2e-runner-check.mjs
      - name: PWA failure paths and Firefox storage
        run: node scripts/e2e/me-93-pwa-resilience.e2e.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ github.run_attempt }}
          path: |
            artifacts/e2e
            qa/out/pwa
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1'
