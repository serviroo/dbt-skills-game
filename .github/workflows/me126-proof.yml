name: ME-126 proof
on:
  push:
    branches: ['servi/me-126-ci-proof*']
permissions:
  contents: read
jobs:
  two-prompts-freeze:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: two-prompts freeze probe, 10 runs
        run: |
          for i in $(seq 10); do
            node scripts/e2e.mjs --file=zz-freeze > run.log 2>&1; grep -E "FREEZE|FAIL" run.log
          done
