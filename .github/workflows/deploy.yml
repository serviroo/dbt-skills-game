name: Deploy to GitHub Pages

# Deploys main's newest commit once CI has passed on that exact commit, or main as it is now on a manual run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_PATH: /dbt-skills-game/

jobs:
  # CI runs can finish out of order, and an older commit's CI can be re-run, so a CI run deploys its commit only while
  # that commit is still main's newest; otherwise it deploys nothing and the newer commit deploys when its own CI passes
  newest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tip.outputs.sha }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ $tip =~ ^[0-9a-f]{40}$ ]] || { echo "could not read main's newest commit: $tip"; exit 1; }
          if [ -n "$PASSED" ] && [ "$PASSED" != "$tip" ]; then
            echo "::notice::Not deploying $PASSED: main is now at $tip, which deploys once CI passes on it"
            exit 0
          fi
          echo "sha=$tip" >> "$GITHUB_OUTPUT"

  # one build and deploy at a time; a run that deploys nothing never waits here, so it can't hold back a newer deploy
  build:
    needs: newest
    if: needs.newest.outputs.sha != ''
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      BUILD_ID: ${{ needs.newest.outputs.sha }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_ID }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Browsers come from the container
        run: test "$(npx playwright --version)" = "Version 1.64.1" || { echo "package-lock has $(npx playwright --version); set the same version in the container image above"; exit 1; }
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Build for the Pages subpath
        run: npm run build
        env:
          LANTERN_GL: software
      - name: Offline install and boot
        run: node scripts/pwa-verify.mjs --software --path="$BASE_PATH" --browser=chromium --out=artifacts/pwa --check
      - name: Quiet update to the next deploy
        run: node scripts/pwa-verify.mjs --software --path="$BASE_PATH" --browser=chromium --update --out=artifacts/pwa --check
      - name: CSP sweep
        run: node scripts/pwa-csp-sweep.mjs --software --path="$BASE_PATH" --check
      - name: Live check on a Pages-like server
        run: |
          node scripts/serve-static.mjs --dir=dist --base="$BASE_PATH" --port=4180 &
          node scripts/live-check.mjs --software "http://127.0.0.1:4180$BASE_PATH" --expect="$BUILD_ID" --wait=30
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-checks
          path: artifacts/
          # as in CI: only from a failed build, kept 3 days
          retention-days: 3
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
